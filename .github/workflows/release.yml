name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: chip8-macos
            output: chip8
          - os: windows-latest
            artifact: chip8-windows
            output: chip8.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SDL
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3-latest

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: odin build src/ -out:${{ matrix.output }} -o:speed

      - name: Copy SDL3.dll (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp "${{ steps.sdl.outputs.prefix }}/bin/SDL3.dll" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.output }}
            *.dll

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Zip Archives
        run: |
          cd artifacts/chip8-windows && zip -r ../../chip8-windows.zip ./* && cd ../..
          cd artifacts/chip8-macos && tar -czvf ../../chip8-macos.tar.gz ./* && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chip8-windows.zip
            chip8-macos.tar.gz
          generate_release_notes: true
