name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: chip8-macos
            output: chip8
            flags: ""
            archive: chip8-macos.tar.gz
          - os: windows-latest
            artifact: chip8-windows
            output: chip8.exe
            flags: "-subsystem:windows"
            archive: chip8-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl3

      - name: Setup SDL (Windows)
        if: runner.os == 'Windows'
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3-latest

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: odin build src/ -out:${{ matrix.output }} -o:speed ${{ matrix.flags }}

      - name: Bundle and Compress (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ steps.sdl.outputs.prefix }}/bin/SDL3.dll" -Destination .
          Compress-Archive -Path ${{ matrix.output }}, SDL3.dll -DestinationPath ${{ matrix.archive }}

      - name: Bundle and Compress (macOS)
        if: runner.os == 'macOS'
        run: |
          cp $(brew --prefix sdl3)/lib/libSDL3.dylib .
          install_name_tool -add_rpath @executable_path ${{ matrix.output }} || true
          install_name_tool -change "$(brew --prefix sdl3)/lib/libSDL3.dylib" "@executable_path/libSDL3.dylib" ${{ matrix.output }} || true
          tar -czvf ${{ matrix.archive }} ${{ matrix.output }} libSDL3.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true 

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/chip8-windows.zip
            artifacts/chip8-macos.tar.gz
          generate_release_notes: true
