name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: chip8-macos
            output: chip8
          - os: windows-latest
            artifact: chip8-windows
            output: chip8.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/odin@v2
        with:
          version: master

      - name: Build
        run: odin build src/ -out:${{ matrix.output }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
